<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<title>Pitaka</title>
<style>
:root{--bg:#F5F5F7;--card:#FFFFFF;--text:#1D1D1F;--text2:#6E6E73;--text3:#AEAEB2;--sep:rgba(60,60,67,.14);--blue:#007AFF;--green:#34C759;--red:#FF3B30;--orange:#FF9500;--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.22);--sheet:#F2F2F7}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1C1C1E;--text:#F5F5F7;--text2:#98989D;--text3:#636366;--sep:rgba(84,84,88,.55);--blue:#0A84FF;--green:#30D158;--red:#FF453A;--orange:#FF9F0A;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);--sheet:#1C1C1E}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:17px;color:var(--text)}
main{padding:8px 16px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:12px 0 6px}
h1{font-size:32px;line-height:1.1;font-weight:700;margin:0;letter-spacing:-.02em}
.sub{color:var(--text2);font-size:15px}
h2{font-size:13px;font-weight:400;text-transform:uppercase;letter-spacing:.02em;color:var(--text2);margin:24px 16px 6px}
.card{background:var(--card);border-radius:12px;overflow:hidden}
.pad{padding:14px 16px}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row .main{flex:1;min-width:0}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;white-space:nowrap}
.emo{width:30px;height:30px;border-radius:8px;background:var(--fill);display:grid;place-items:center;font-size:16px;flex:none}
.chev::after{content:"›";color:var(--text3);font-size:22px;margin-left:4px}
.big{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.neg{color:var(--red)}.pos{color:var(--green)}.muted{color:var(--text2)}.warn{color:var(--orange)}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:3px}
.bar.over>i{background:var(--red)}.bar.good>i{background:var(--green)}
.btn{color:var(--blue);font-size:17px}
.btnp{display:block;width:100%;background:var(--blue);color:#fff;border-radius:12px;height:50px;font-weight:600;font-size:17px;margin-top:12px}
.btns{display:block;width:100%;background:var(--fill);color:var(--blue);border-radius:12px;height:50px;font-weight:600;font-size:17px;margin-top:10px}
.btnd{color:var(--red)}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--fill);color:var(--text2);margin-left:6px;vertical-align:middle}
.pill.b{background:var(--blue);color:#fff}.pill.g{background:var(--green);color:#fff}.pill.o{background:var(--orange);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:12px;padding:12px 14px}
.stat .l{font-size:13px;color:var(--text2)}.stat .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--text3)}
.tabbar button.on{color:var(--blue)}
.tabbar svg{width:26px;height:26px}
.tabbar .plus{flex:none;width:56px}
.tabbar .plus span{width:44px;height:44px;border-radius:22px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:30px;line-height:1;margin-top:-2px}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.monthnav button{font-size:26px;color:var(--blue);width:44px;height:36px}
.monthnav b{font-size:17px}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:14px}
.seg button{flex:1;padding:6px 0;border-radius:7px;font-size:14px;font-weight:500}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:12px}
.cal span{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:13px;color:var(--text3);background:var(--fill)}
.cal span.st{background:var(--blue);color:#fff;font-weight:600}
.cal span.ns{background:var(--green);color:#fff;font-weight:600}
.cal span.td{outline:2px solid var(--blue);outline-offset:1px}
.cal span.fu{background:transparent}
.cal b{font-size:11px;color:var(--text2);text-align:center;font-weight:500}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;text-align:right;white-space:nowrap}th{font-weight:500;color:var(--text2);font-size:12px}
td:first-child,th:first-child{text-align:left}
tr+tr td{border-top:.5px solid var(--sep)}
.toggle{display:flex;align-items:center;justify-content:space-between}
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.sw.on{background:var(--green)}.sw.on::after{left:22px}
.note{font-size:13px;color:var(--text2);margin:8px 16px 0}
.empty{padding:22px 16px;text-align:center;color:var(--text2);font-size:15px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--sheet);border-radius:14px 14px 0 0;z-index:21;padding:0 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease-out;max-width:640px;margin:0 auto;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
.shead{position:sticky;top:0;background:var(--sheet);display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;z-index:2}
.shead b{font-size:17px}
.field{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:46px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.field label{flex:none;width:118px;color:var(--text)}
.field input,.field select,.field textarea{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;text-align:right;outline:none;-webkit-appearance:none;appearance:none}
.field select{text-align:right;text-align-last:right}
.field input[type=date],.field input[type=time]{display:flex;justify-content:flex-end;text-align:right;min-height:46px}
.field input::-webkit-date-and-time-value{text-align:right;margin:0}
.dcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px 10px}
.dcal b{font-size:11px;color:var(--text2);text-align:center;font-weight:500;padding-bottom:2px}
.dcal button{aspect-ratio:1/1.05;border-radius:9px;background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.dcal button span{font-size:11px;color:var(--text2)}.dcal button em{font-style:normal;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.dcal button.fu{background:transparent;outline:1px dashed var(--sep)}.dcal button.fu em{color:var(--text3);font-weight:500}
.dcal button.ov em{color:var(--red)}.dcal button.td{outline:2px solid var(--blue)}.dcal button.sel{background:var(--blue)}.dcal button.sel span,.dcal button.sel em{color:#fff}
.sech{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:13px;text-transform:uppercase;letter-spacing:.02em;color:var(--text2);padding:20px 16px 8px}
.chev2{font-size:18px;line-height:1;transition:transform .2s;display:inline-block}.chev2.up{transform:rotate(180deg)}
.swr{position:relative;overflow:hidden}.swr+.swr::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep);z-index:2}
.swdel{position:absolute;right:0;top:0;bottom:0;width:88px;background:var(--red);color:#fff;font-weight:600;font-size:15px}
.swc{background:var(--card);transition:transform .2s;position:relative;z-index:1}
.chart{position:relative;padding:12px 12px 8px}.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .tip{position:absolute;top:8px;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:8px;white-space:nowrap;transform:translateX(-50%);display:none}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text2);padding:0 4px 6px}.legend i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.field input[type=checkbox]{flex:none;width:22px;height:22px;-webkit-appearance:checkbox;appearance:auto}
.amt{text-align:center;padding:10px 0 4px}
.amt input{width:100%;border:0;background:transparent;text-align:center;font-size:44px;font-weight:700;outline:none;font-variant-numeric:tabular-nums}
.amt small{color:var(--text2)}
.ops{display:flex;gap:6px;margin:4px 0 12px}.ops button{flex:1;height:40px;border-radius:10px;background:var(--fill);font-size:20px;font-weight:500;color:var(--blue)}
.opt{border:2px solid transparent}
.opt.rec{border-color:var(--blue)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:15px;font-weight:500;z-index:40;animation:fade .2s;white-space:nowrap}
.hero{text-align:center;padding:60px 20px}
.hero .ic{width:84px;height:84px;border-radius:20px;margin:0 auto 18px;display:block}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>
<input type="file" id="importFile" hidden>
<script>
'use strict';
/* ---------- utils ---------- */
const KEY='pitaka.v1';
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const nowTime=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const mk=iso=>String(iso||'').slice(0,7);
const addM=(m,n)=>{let[y,mo]=m.split('-').map(Number);mo+=n;y+=Math.floor((mo-1)/12);mo=((mo-1)%12+12)%12+1;return `${y}-${pad(mo)}`};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MNL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const mLabel=(m,long)=>{if(!m)return'';const[y,mo]=m.split('-').map(Number);return (long?MNL:MN)[mo-1]+' '+y};
const dLabel=iso=>{if(!iso)return'';const[y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1,d);return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})};
const dShort=iso=>{if(!iso)return'';const[y,m,d]=iso.split('-').map(Number);return MN[m-1]+' '+d+(y!==new Date().getFullYear()?', '+y:'')};
const daysIn=m=>{const[y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{let s=String(v??'').replace(/[,₱₩\s=]/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-');if(!s)return 0;if(/^-?\d*\.?\d+$/.test(s))return parseFloat(s);s=s.replace(/[+\-*/.]+$/,'');if(!/^[\d.+\-*/()]+$/.test(s))return 0;try{const r=Function('"use strict";return('+s+')')();return isFinite(r)?r:0}catch(e){return 0}};
const SYM={PHP:'₱',KRW:'₩'};
const HIDE=()=>!!(S&&S.settings&&S.settings.hide);
const money=(n,cur='PHP')=>{if(HIDE())return (SYM[cur]||'')+'•••';const v=Math.round(n||0);return (v<0?'−':'')+(SYM[cur]||'')+Math.abs(v).toLocaleString('en-US')};
const kmoney=n=>{if(HIDE())return '•••';const v=Math.round(n||0);return Math.abs(v)>=1000?(v/1000).toFixed(v%1000===0||Math.abs(v)>=10000?0:1)+'k':String(v)};
const isSavAcc=a=>a&&(a.kind==='savings'||a.kind==='both'),isSpendAcc=a=>a&&(a.kind==='spending'||a.kind==='both');
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+(f(x)||0),0);

/* ---------- state ---------- */
let S=null;
const UI={tab:'today',month:mk(todayISO()),logMonth:mk(todayISO()),logAll:false,late:false};
function blankState(){return{version:1,settings:{startMonth:mk(todayISO()),koreaStart:'2099-01',krwToPhp:0.0463},accounts:[{id:'cash',name:'Cash',currency:'PHP',kind:'spending',start:0}],envelopes:[],monthBudgets:{},moves:[],tx:[],checkins:{},goals:[],debts:[],incomes:[],costs:[],wishlist:[],stampSpends:[],backups:[]}}
function normalize(s){const b=blankState();for(const k in b)if(s[k]==null)s[k]=b[k];s.settings=Object.assign(b.settings,s.settings);return s}
function migrate(s){
  if((s.version||1)<2){
    const E=id=>s.envelopes.find(e=>e.id===id);
    const ap=E('apple');if(ap){if(/apple/i.test(ap.name))ap.name='Subscriptions';ap.fixed=false;ap.emoji='🔁'}
    const ld=E('load');if(ld){ld.archived=true}
    if(s.envelopes.some(e=>e.phase==='PH')&&!E('others')){const f=E('fun');s.envelopes.push({id:'others',emoji:'📦',name:'Others',budget:1000,phase:'PH',currency:'PHP',fixed:false,daily:false,isSavings:false,isTreat:false,archived:false,order:(f?.order??10)+0.5})}
    s.tx.forEach(t=>{if(t.envId==='load')t.envId='others'});
    const sv=E('save');
    if(sv){sv.name='Savings';sv.emoji='🐷';sv.budget=3500;
      if(!E('debt'))s.envelopes.push({id:'debt',emoji:'🤝',name:'Debt repayment',budget:2500,phase:'PH',currency:'PHP',fixed:false,daily:false,isSavings:false,isDebt:true,isTreat:false,archived:false,order:(sv.order??12)+0.5});
      if(s.settings.startMonth<='2026-10'){s.monthBudgets['2026-10']=Object.assign({},s.monthBudgets['2026-10']||{},{debt:0})}}
    const sk=E('save_kr');if(sk)sk.name='Savings';
    if(!s.accounts.find(a=>a.id==='locked')){const i=s.accounts.findIndex(a=>a.id==='gotyme');s.accounts.splice(i>=0?i+1:s.accounts.length,0,{id:'locked',name:'LOCKED SAVINGS (GoTyme)',currency:'PHP',kind:'savings',start:0})}
    const acc=id=>s.accounts.find(a=>a.id===id);
    s.tx.forEach(t=>{
      if(t.type==='expense'&&t.envId==='save'&&!t.toAccountId)t.toAccountId='locked';
      if(t.type==='transfer'&&!t.coverEnvId){const f=acc(t.accountId),to=acc(t.toAccountId);if(f&&to&&f.kind==='spending'&&to.kind==='savings'&&sv){t.type='expense';t.envId='save'}}
    });
    s.version=2;
  }
  if(s.version<3){
    const A=id=>s.accounts.find(a=>a.id===id),E=id=>s.envelopes.find(e=>e.id===id);
    let pg=A('locked');if(pg){pg.name='Piggy bank';pg.kind='savings'}else{pg={id:'locked',name:'Piggy bank',currency:'PHP',kind:'savings',start:0};s.accounts.push(pg)}
    if(A('gotyme'))A('gotyme').kind='both';if(A('maya'))A('maya').kind='savings';
    ['bpi','cash'].forEach(i=>{if(A(i))A(i).kind='spending'});
    ['gcash','rcbc','maribank','kr'].forEach(i=>{if(A(i))A(i).archived=true});
    const order=['bpi','cash','gotyme','maya','locked'];s.accounts.sort((a,b)=>{const x=order.indexOf(a.id),y=order.indexOf(b.id);return (x<0?99:x)-(y<0?99:y)});
    ['save','debt','save_kr'].forEach(i=>{if(E(i))E(i).archived=true});
    const o=E('others');if(o){o.isOthers=true;o.budget=0}
    if(s.envelopes.some(e=>e.phase==='KR')&&!E('others_kr'))s.envelopes.push({id:'others_kr',emoji:'📦',name:'Others',budget:0,phase:'KR',currency:'KRW',isOthers:true,fixed:false,daily:false,archived:false,order:99});
    s.tx.forEach(t=>{
      if(t.type==='expense'&&(t.envId==='save'||t.envId==='save_kr')){t.type='transfer';t.toAccountId=t.toAccountId||'locked';delete t.envId}
      if(t.type==='expense'&&t.envId==='debt')t.envId='others';
    });
    s.settings.saveTarget=s.settings.saveTarget||{PH:3500,KR:260000};
    s.settings.sec=s.settings.sec||{daily:true,pace:true,stamps:true};
    s.version=3;
  }
  return s}
function load(){try{const r=localStorage.getItem(KEY);if(!r)return null;const s=migrate(normalize(JSON.parse(r)));localStorage.setItem(KEY,JSON.stringify(s));return s}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Could not save. Export a backup now.')}}
function commit(){save();render()}

/* ---------- lookups ---------- */
const accById=id=>S.accounts.find(a=>a.id===id);
const envById=id=>S.envelopes.find(e=>e.id===id);
const debtById=id=>S.debts.find(d=>d.id===id);
const accCur=id=>accById(id)?.currency||'PHP';
const phaseOf=m=>m>=S.settings.koreaStart?'KR':'PH';
const activeEnvs=m=>S.envelopes.filter(e=>e.phase===phaseOf(m)&&!e.archived).sort((a,b)=>(a.order??0)-(b.order??0));
const phaseCur=m=>phaseOf(m)==='KR'?'KRW':'PHP';
function conv(n,from,to){if(from===to)return n;const r=S.settings.krwToPhp||0.0463;if(from==='KRW'&&to==='PHP')return n*r;if(from==='PHP'&&to==='KRW')return n/r;return n}
const budgetOf=(e,m)=>{if(e.isOthers)return othersBudget(m);const o=S.monthBudgets[m];return(o&&o[e.id]!=null)?o[e.id]:e.budget};

/* ---------- derived ---------- */
let D={},memo={};
const savOnly=a=>a&&a.kind==='savings';
function savingsFlowPHP(t){if(t.type!=='transfer'||t.coverEnvId)return 0;const f=accById(t.accountId),to=accById(t.toAccountId);if(!f||!to)return 0;
  if(!savOnly(f)&&savOnly(to))return conv(t.amount,f.currency,'PHP');if(savOnly(f)&&!savOnly(to))return -conv(t.amount,f.currency,'PHP');return 0}
const saveTarget=m=>num((S.settings.saveTarget||{})[phaseOf(m)]);
const savedIn=m=>conv(D.dep[m]||0,'PHP',phaseCur(m));
function monthIncome(m){const cur=phaseCur(m),rec=received();return sum(S.tx.filter(t=>t.type==='income'&&mk(t.date)===m),t=>conv(t.amount,accCur(t.accountId),cur))+sum(S.incomes.filter(i=>!rec.has(i.id)&&mk(i.date)===m),i=>conv(num(i.amount),i.currency||'PHP',cur))}
function othersBudget(m){return Math.max(0,monthIncome(m)-sum(activeEnvs(m).filter(e=>!e.isOthers&&!e.isSavings),e=>budgetOf(e,m))-saveTarget(m))}
function _oldFlow(t){
  if(t.type==='transfer'){const f=accById(t.accountId),to=accById(t.toAccountId);if(!f||!to)return 0;
    if(f.kind==='spending'&&to.kind==='savings')return conv(t.amount,f.currency,'PHP');
    if(f.kind==='savings'&&to.kind==='spending')return -conv(t.amount,f.currency,'PHP');return 0}
  if(t.type==='debtpay'){const f=accById(t.accountId);if(f&&f.kind==='spending')return conv(t.amount,f.currency,'PHP')}
  return 0}
const add=(o,k,v)=>{o[k]=(o[k]||0)+v};
function derive(){
  memo={};const spent={},dep={},cover={},moves={},dips={},bal={};
  S.accounts.forEach(a=>bal[a.id]=num(a.start));
  for(const t of S.tx){
    const m=mk(t.date),a=t.amount;
    if(t.type==='expense'||t.type==='debtpay'){if(t.accountId in bal)bal[t.accountId]-=a;if(t.type==='expense'&&t.toAccountId&&envById(t.envId)?.isSavings&&t.toAccountId in bal)bal[t.toAccountId]+=conv(a,accCur(t.accountId),accCur(t.toAccountId))}
    else if(t.type==='income'||t.type==='adjust'){if(t.accountId in bal)bal[t.accountId]+=a}
    else if(t.type==='transfer'){if(t.accountId in bal)bal[t.accountId]-=a;if(t.toAccountId in bal)bal[t.toAccountId]+=conv(a,accCur(t.accountId),accCur(t.toAccountId))}
    if(t.type==='expense'&&t.envId){const e=envById(t.envId);if(e)add(spent,m+'|'+e.id,conv(a,accCur(t.accountId),e.currency))}
    const sf=savingsFlowPHP(t);if(sf)add(dep,m,sf);
    if(t.coverEnvId){const e=envById(t.coverEnvId);if(e){add(cover,m+'|'+e.id,conv(a,accCur(t.accountId),e.currency));dips[m]=true}}
  }
  for(const mv of S.moves){add(moves,mv.month+'|'+mv.to,mv.amount);if(mv.from)add(moves,mv.month+'|'+mv.from,-mv.amount)}
  D={spent,dep,cover,moves,dips,bal};
}
function spentOf(e,m){return D.spent[m+'|'+e.id]||0}
function carryOf(e,m){if(m<=S.settings.startMonth)return 0;const pm=addM(m,-1);if(phaseOf(pm)!==e.phase)return 0;const v=avail(e,pm);return e.isSavings?Math.max(0,v):v}
function avail(e,m){const k=e.id+m;if(k in memo)return memo[k];memo[k]=0;
  const v=budgetOf(e,m)+carryOf(e,m)+(D.moves[m+'|'+e.id]||0)+(D.cover[m+'|'+e.id]||0)-spentOf(e,m);memo[k]=v;return v}
const liveAccs=()=>S.accounts.filter(a=>!a.archived);
const totalPHP=()=>sum(liveAccs(),a=>conv(D.bal[a.id]||0,a.currency,'PHP'));
const received=()=>new Set(S.tx.filter(t=>t.incomeId).map(t=>t.incomeId));
const paidCosts=()=>new Set(S.tx.filter(t=>t.costId).map(t=>t.costId));
function debtOwed(d){return num(d.start)+sum(S.tx.filter(t=>t.type==='income'&&t.debtId===d.id),t=>t.amount)-sum(S.tx.filter(t=>t.type==='debtpay'&&t.debtId===d.id),t=>t.amount)}
const savingsEnv=m=>activeEnvs(m).find(e=>e.isSavings);
const treatEnv=m=>activeEnvs(m).find(e=>e.isTreat);

/* ---------- stamps ---------- */
function logDays(){const s=new Set();S.tx.forEach(t=>{if(t.type!=='adjust')s.add(t.date)});Object.keys(S.checkins).forEach(d=>s.add(d));return s}
const expenseDays=()=>new Set(S.tx.filter(t=>t.type==='expense').map(t=>t.date));
function monthClean(m){
  if(D.dips[m])return false;
  if(saveTarget(m)>0&&savedIn(m)<saveTarget(m)-0.5)return false;
  for(const e of activeEnvs(m)){const v=avail(e,m);if(!e.isSavings&&!e.isDebt&&v<-0.5)return false}
  return true}
function isoWeek(iso){const[y,m,d]=iso.split('-').map(Number);const dt=new Date(Date.UTC(y,m-1,d));const day=dt.getUTCDay()||7;dt.setUTCDate(dt.getUTCDate()+4-day);const y0=new Date(Date.UTC(dt.getUTCFullYear(),0,1));return dt.getUTCFullYear()+'-'+Math.ceil(((dt-y0)/864e5+1)/7)}
function stampLedger(){
  const L=[],days=logDays(),exp=expenseDays();
  days.forEach(d=>L.push({date:d,n:1,why:'Logged your day'}));
  for(const d in S.checkins)if(S.checkins[d]==='nospend'&&!exp.has(d))L.push({date:d,n:1,why:'No-spend day'});
  for(const t of S.tx){
    const sf=savingsFlowPHP(t);
    if(t.type==='transfer'&&sf>0){const n=Math.floor(sf/1000);if(n)L.push({date:t.date,n,why:'Savings'})}
    if(t.type==='expense'){const e=envById(t.envId);if(e&&(e.isSavings||e.isDebt)){const n=Math.floor(conv(t.amount,accCur(t.accountId),'PHP')/1000);if(n)L.push({date:t.date,n,why:e.isSavings?'Savings':'Debt repayment'})}}
    if(t.type==='debtpay'){const n=Math.floor(conv(t.amount,accCur(t.accountId),'PHP')/1000);if(n)L.push({date:t.date,n,why:'Debt payment'})}
  }
  const cur=mk(todayISO());
  for(let m=S.settings.startMonth;m<cur;m=addM(m,1))if(monthClean(m))L.push({date:m+'-'+pad(daysIn(m)),n:10,why:'Clean month: '+mLabel(m)});
  const wk=new Set();(S.backups||[]).forEach(d=>{const w=isoWeek(d);if(!wk.has(w)){wk.add(w);L.push({date:d,n:1,why:'Weekly backup'})}});
  return L.sort((a,b)=>b.date.localeCompare(a.date))}
function stampBalance(){return sum(stampLedger(),x=>x.n)-sum(S.stampSpends,x=>x.n)}
function streak(){const days=logDays();let d=new Date();const iso=x=>`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;if(!days.has(iso(d)))d.setDate(d.getDate()-1);let n=0;while(days.has(iso(d))){n++;d.setDate(d.getDate()-1)}return n}
const wishCost=w=>num(w.stamps)>0?Math.round(num(w.stamps)):Math.max(1,Math.ceil(num(w.price)/100));
function onTrack(){
  const m=mk(todayISO()),why=[];const tg=saveTarget(m),sv=savedIn(m);
  if(tg>0&&sv<tg-0.5)why.push(`Save ${money(tg-sv,phaseCur(m))} more this month`);
  if(D.dips[m])why.push('You took from savings this month');
  return{ok:!why.length,why}}
function wishStatus(w){
  const m=mk(todayISO()),cost=wishCost(w),bal=stampBalance(),tr=onTrack(),te=treatEnv(m),why=[];
  if(bal<cost)why.push(`${cost-bal} more stamp${cost-bal>1?'s':''}`);
  why.push(...tr.why);
  if(te){const a=avail(te,m),pr=conv(num(w.price),'PHP',te.currency);if(a<pr)why.push(`${te.name} needs ${money(pr-a,te.currency)} more`)}
  return{ok:!why.length,why,cost}}

/* ---------- forecast ---------- */
function forecast(late){
  const cur=mk(todayISO()),end=addM(S.settings.koreaStart>'2090'?addM(cur,6):S.settings.koreaStart,2);
  const rec=received(),paid=paidCosts();let bal=totalPHP();const rows=[];let low={v:Infinity,m:''},dropped=0;
  for(let m=cur;m<=end;m=addM(m,1)){
    let inn=0,out=0;
    for(const i of S.incomes){if(rec.has(i.id))continue;let im=mk(i.date);if(late&&i.kind==='tranche')im=addM(im,2);if(im<cur)im=cur;if(im===m)inn+=conv(num(i.amount),i.currency||'PHP','PHP');if(m===cur&&im>end)dropped++}
    for(const e of activeEnvs(m)){if(e.isSavings||e.isOthers)continue;const v=m===cur?Math.max(0,avail(e,m)):budgetOf(e,m);out+=conv(v,e.currency,'PHP')}
    bal+=inn-out;rows.push({m,inn,out,bal});if(bal<low.v)low={v:bal,m};
  }
  return{rows,low,dropped}}

function txLine(t){
  const acc=accById(t.accountId),to=accById(t.toAccountId);let title=t.desc,sub='',amt=money(t.amount,acc?.currency),cls='';
  if(t.type==='expense'){const e=envById(t.envId),c=S.costs.find(c=>c.id===t.costId);title=title||e?.name||c?.name||'Expense';sub=[e?e.name:(c?'Planned: '+c.name:''),acc?.name+(e?.isSavings&&to?' → '+to.name:'')].filter(Boolean).join(' · ');amt=(e?.isSavings?'':'−')+amt;if(e?.isSavings)cls='muted'}
  else if(t.type==='income'){title=title||'Income';sub='Income → '+(acc?.name||'');amt='+'+amt;cls='pos'}
  else if(t.type==='transfer'){const sf=savingsFlowPHP(t);title=title||(sf>0?'Savings':sf<0?'Savings withdrawal':'Transfer');sub=`${acc?.name||'?'} → ${to?.name||'?'}`+(t.coverEnvId?' · covered '+(envById(t.coverEnvId)?.name||''):'')}
  else if(t.type==='debtpay'){title=title||('Paid '+(debtById(t.debtId)?.name||'debt'));sub='Debt payment · '+(acc?.name||'');amt='−'+amt}

const dayEnvs=m=>activeEnvs(m).filter(e=>!e.fixed&&!e.isSavings&&!e.isDebt&&!e.isOthers);
function dailyInfo(m){
  const envs=dayEnvs(m),ids=new Set(envs.map(e=>e.id)),cur=phaseCur(m),t=todayISO(),tm=mk(t),n=daysIn(m);
  const spent={};S.tx.forEach(x=>{if(x.type==='expense'&&mk(x.date)===m&&ids.has(x.envId))add(spent,x.date,conv(x.amount,accCur(x.accountId),cur))});
  const base=sum(envs,e=>budgetOf(e,m))/n;let allow=base;
  if(m===tm){const left=sum(envs,e=>avail(e,m)),td=Number(t.slice(8));allow=Math.max(0,(left+(spent[t]||0))/(n-td+1))}
  return{spent,base,allow,cur,n,envs}}
function sec(k,title,body){const open=(S.settings.sec||{})[k]!==false;return `<button class="sech" data-act="sec" data-v="${k}"><span>${title}</span><span class="chev2 ${open?'up':''}">⌄</span></button>${open?body:''}`}

  if(UI.logDay&&mk(UI.logDay)===m)list=list.filter(x=>x.date===UI.logDay);

  const days=[...new Set(list.map(x=>x.date))];

    const lim=isT?di.allow:di.base;const cls=[fut?'fu':'',isT?'td':'',!fut&&sp>lim+0.5?'ov':'',UI.logDay===iso?'sel':''].join(' ');
    cal+=`<button class="${cls}" data-act="day" data-v="${iso}"><span>${d}</span><em>${fut?kmoney(di.allow):(sp?kmoney(sp):'–')}</em></button>`}
  return `<div class="top"><h1>Expenses</h1><div style="display:flex;gap:14px"><button data-act="hide" class="btn" aria-label="Hide numbers">${HIDE()?IC.eyeoff:IC.eye}</button><button data-act="settings" class="btn" aria-label="Settings">${IC.gear}</button></div></div>

  <div class="card pad"><div class="sub">Spent in ${MNL[mo-1]}${nb?' (without fixed bills)':''}</div><div class="big ${spent>budget?'neg':''}">${money(spent,cur)}</div>
   <div class="bar ${spent>budget?'over':''}"><i style="width:${pct}%"></i></div>

   <div class="seg" style="margin:12px 0 0"><button class="${nb?'':'on'}" data-act="noBills" data-v="0">All expenses</button><button class="${nb?'on':''}" data-act="noBills" data-v="1">Without fixed bills</button></div></div>

  <div class="seg" style="margin-top:14px"><button class="${all?'':'on'}" data-act="logAll" data-v="0">Expenses</button><button class="${all?'on':''}" data-act="logAll" data-v="1">All activity</button></div>
  ${UI.logDay&&mk(UI.logDay)===m?`<div class="note" style="margin:0 4px 6px">Showing ${dLabel(UI.logDay)} · <button class="btn" style="font-size:13px" data-act="day" data-v="${UI.logDay}">Show all days</button></div>`:''}
  ${days.map(d=>`<h2 style="margin-top:14px">${dLabel(d)}</h2><div class="card">${list.filter(x=>x.date===d).map(txLine).join('')}</div>`).join('')||`<div class="card" style="margin-top:4px"><div class="empty">${all?'No activity':'No expenses'} ${UI.logDay&&mk(UI.logDay)===m?'on this day':'in '+mLabel(m,1)}. Tap + to log one.</div></div>`}`}

  ${chart}
  <h2>Envelopes</h2><div class="card">${envs.filter(e=>!e.isOthers).map(row).join('')||'<div class="empty">No envelopes for this phase.</div>'}</div>

function vRewards(){

  const tr=onTrack();
  const open=S.wishlist.filter(w=>!w.bought),done=S.wishlist.filter(w=>w.bought);

/* ---------- sheets ---------- */
function openSheet(title,body,{right=''}={}){
  const ex=$('#sheet-root .sheet');if(ex){const st=ex.scrollTop;ex.innerHTML=`<div class="shead"><button class="btn" data-act="close">Cancel</button><b>${esc(title)}</b><span style="min-width:56px;text-align:right">${right}</span></div>${body}`;ex.scrollTop=st;return}
  $('#sheet-root').innerHTML=`<div class="scrim" data-act="close"></div><div class="sheet" role="dialog"><div class="shead"><button class="btn" data-act="close">Cancel</button><b>${esc(title)}</b><span style="min-width:56px;text-align:right">${right}</span></div>${body}</div>`;
  document.body.style.overflow='hidden'}
function closeSheet(){$('#sheet-root').innerHTML='';document.body.style.overflow=''}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
const opt=(v,l,sel)=>`<option value="${esc(v)}" ${String(v)===String(sel)?'selected':''}>${esc(l)}</option>`;
const accOpts=(sel,filter=()=>true)=>S.accounts.filter(a=>(!a.archived&&filter(a))||a.id===sel).map(a=>opt(a.id,a.name+(a.currency==='KRW'?' (₩)':''),sel)).join('');
const F=(label,inner)=>`<div class="field"><label>${label}</label>${inner}</div>`;

let lastAcc=null,lastEnv=null,lastSaveTo=null;
function txSheet(type,t){
  const isNew=!t||!t.id;t=t||{type,date:todayISO(),time:nowTime(),amount:'',desc:'',accountId:lastAcc||S.accounts[0]?.id};
  type=t.type;const m=mk(t.date);
  const segs=[['expense','Spend'],['income','Income'],['transfer','Move $']];
  const segKey=type;
  let fields='';
  const dt=F('Date',`<input type="date" name="date" value="${t.date}" required>`)+F('Time',`<input type="time" name="time" value="${t.time||''}" placeholder="optional">`);
  if(type==='expense'){
    const envs=activeEnvs(m);
    fields=F('What',`<input name="desc" value="${esc(t.desc)}" placeholder="e.g. Iced latte" autocomplete="off">`)+
      F('Envelope',`<select name="envId">${t.costId&&!t.envId?opt('','— planned payment —',''):''}${envs.map(e=>opt(e.id,(e.emoji?e.emoji+' ':'')+e.name+(e.isSavings?' (not deducted)':''),t.envId||(t.costId?'':(envs.find(x=>x.id===lastEnv)||envs.find(x=>x.daily)||envs.find(x=>!x.fixed)||{}).id))).join('')}</select>`)+
      F('<span class="paidlbl">Paid with</span>',`<select name="accountId">${accOpts(t.accountId)}</select>`)+
      `<div class="field savedto" style="display:none"><label>Saved to</label><select name="toAccountId">${accOpts(t.toAccountId||lastSaveTo||(S.accounts.find(a=>a.id==='locked')||S.accounts.find(isSavAcc)||{}).id)}</select></div>`+dt;
  }else if(type==='income'){
    const rec=received();const incs=S.incomes.filter(i=>!rec.has(i.id)||i.id===t.incomeId);
    fields=F('What',`<input name="desc" value="${esc(t.desc)}" placeholder="e.g. Barista pay" autocomplete="off">`)+
      F('Into',`<select name="accountId">${accOpts(t.accountId)}</select>`)+
      F('Expected item',`<select name="incomeId">${opt('','— none —',t.incomeId)}${incs.map(i=>opt(i.id,i.name+' ('+dShort(i.date)+')',t.incomeId)).join('')}</select>`)+dt;
  }else if(type==='transfer'){
    const save=false;
    fields=F('Note',`<input name="desc" value="${esc(t.desc)}" placeholder="${save?'e.g. Monthly savings':'e.g. ATM withdrawal'}" autocomplete="off">`)+
      F('From',`<select name="accountId">${accOpts(t.accountId,save?(a=>a.kind==='spending'):undefined)}</select>`)+
      F('To',`<select name="toAccountId">${accOpts(t.toAccountId||(save?S.accounts.find(a=>a.kind==='savings')?.id:'cash'),save?(a=>a.kind==='savings'):undefined)}</select>`)+dt;
  }else if(type==='debtpay'){
    fields=F('Debt',`<select name="debtId">${S.debts.map(d=>opt(d.id,d.name,t.debtId)).join('')}</select>`)+F('Paid from',`<select name="accountId">${accOpts(t.accountId)}</select>`)+dt;
  }else if(type==='adjust'){fields=F('Account',`<select name="accountId">${accOpts(t.accountId)}</select>`)+dt}
  const title=isNew?'Add':'Edit';
  openSheet(title,`${isNew&&!t.incomeId&&!t.costId&&['expense','income','transfer'].includes(type)?`<div class="seg">${segs.map(([k,l])=>`<button type="button" class="${k===segKey?'on':''}" data-act="seg" data-v="${k}">${l}</button>`).join('')}</div>`:''}
   ${t.incomeId&&isNew?'<div class="note" style="margin:0 4px 8px">Change the amount and date to what you actually received.</div>':''}
   ${type==='transfer'&&isNew?'<div class="note" style="margin:0 4px 8px">Moving money between accounts is not spending. Moving into Piggy bank or Maya counts as savings.</div>':''}
   <form data-form="tx" data-id="${t.id||''}" data-type="${type}">
   <div class="amt"><input name="amount" inputmode="decimal" placeholder="0" value="${t.amount===''?'':Math.abs(t.amount)}" ${isNew?'autofocus':''} required autocomplete="off"><small class="calcres">${type==='adjust'?'change (+/−)':'amount'}</small></div><div class="ops">${['+','−','×','÷','(',')','C'].map(o=>`<button type="button" data-op="${o}">${o}</button>`).join('')}</div>
   <div class="card">${fields}</div>
   ${t.costId?`<input type="hidden" name="costId" value="${t.costId}">`:''}${t.wishId?`<input type="hidden" name="wishId" value="${t.wishId}">`:''}${t.debtId&&type==='income'?`<input type="hidden" name="debtId" value="${t.debtId}">`:''}
   <button class="btnp">${isNew?'Save':'Save changes'}</button>
   ${isNew?'':`<button type="button" class="btns btnd" data-act="delTx" data-v="${t.id}">Delete</button>`}
   </form>`);
  if(type==='adjust'&&t.amount<0)$('#sheet-root [name=amount]').value=t.amount;
  syncSavedTo();
}
function syncSavedTo(){const sel=$('#sheet-root [name=envId]'),box=$('#sheet-root .savedto');if(!sel||!box)return;const sv=!!envById(sel.value)?.isSavings;box.style.display=sv?'':'none';const l=$('#sheet-root .paidlbl');if(l)l.textContent=sv?'From':'Paid with'}
document.addEventListener('change',e=>{if(e.target.name==='envId'&&e.target.closest('#sheet-root'))syncSavedTo()});
function saveTx(form){
  const fd=Object.fromEntries(new FormData(form));const type=form.dataset.type,id=form.dataset.id;
  let amount=num(fd.amount);if(type!=='adjust')amount=Math.abs(amount);
  if(!amount){toast('Enter an amount');return}
  const t=id?S.tx.find(x=>x.id===id):{id:uid(),type};
  Object.assign(t,{amount,date:fd.date||todayISO(),time:fd.time||'',desc:(fd.desc||'').trim(),accountId:fd.accountId});
  if(type==='expense'){t.envId=fd.envId||null;if(fd.costId)t.costId=fd.costId;if(fd.wishId)t.wishId=fd.wishId;if(envById(t.envId)?.isSavings){t.toAccountId=fd.toAccountId;lastSaveTo=t.toAccountId}else delete t.toAccountId}
  if(type==='transfer'){t.toAccountId=fd.toAccountId;if(t.toAccountId===t.accountId){toast('Pick two different accounts');return}}
  if(type==='income'){t.incomeId=fd.incomeId||null;const inc=S.incomes.find(i=>i.id===t.incomeId);t.debtId=inc?.debtId||fd.debtId||null;if(!t.desc&&inc)t.desc=inc.name}
  if(type==='debtpay'){t.debtId=fd.debtId;if(fd.costId)t.costId=fd.costId}
  if(!id)S.tx.push(t);
  if(type==='expense'){lastAcc=t.accountId;if(t.envId&&!envById(t.envId)?.fixed)lastEnv=t.envId}
  const wasLogged=!id&&type!=='adjust'&&!logDays().has(t.date);
  save();closeSheet();derive();
  if(type==='expense'&&t.envId){const e=envById(t.envId),m=mk(t.date);const a=avail(e,m);if(a<-0.5&&!e.isSavings&&!e.isDebt&&!e.isOthers){render();coverSheet(e,m,-a);return}}
  render();if(wasLogged&&t.date===todayISO())toast('⭐ +1 stamp');else if(type==='expense'&&(envById(t.envId)?.isSavings||envById(t.envId)?.isDebt)&&t.amount>=1000)toast(`⭐ +${Math.floor(t.amount/1000)} stamps`);else toast('Saved');
}
function coverSheet(e,m,over){
  const others=activeEnvs(m).filter(x=>x.id!==e.id&&!x.isSavings&&!x.isDebt&&!x.fixed&&avail(x,m)>0.5);
  const sav=liveAccs().filter(isSavAcc),sp=liveAccs().filter(isSpendAcc);
  openSheet('Over budget',`<div class="card pad"><div class="t"><b>${esc(e.emoji||'')} ${esc(e.name)}</b> is over by <b class="neg">${money(over,e.currency)}</b> for ${mLabel(m,1)}.</div><div class="sub" style="margin-top:4px">How do you want to cover it?</div></div>
  <h2>Recommended</h2><form class="card opt rec" data-form="coverMove" data-env="${e.id}" data-m="${m}">
   <div class="pad" style="padding-bottom:4px"><b>Move from another envelope</b><div class="sub">You choose what to give up this month. Savings stay untouched.</div></div>
   ${others.length?F('From',`<select name="from">${others.map(x=>opt(x.id,`${x.emoji||''} ${x.name} (${money(avail(x,m),x.currency)} left)`,'')).join('')}</select>`)+F('Amount',`<input name="amount" inputmode="decimal" value="${Math.round(over)}">`)+'<div class="pad"><button class="btnp" style="margin:0">Move money</button></div>':'<div class="pad sub">No flexible envelope has money left.</div>'}
  </form>
  <h2>Other options</h2><form class="card" data-form="coverSave" data-env="${e.id}" data-m="${m}">
   <div class="pad" style="padding-bottom:4px"><b>Take from savings</b><div class="sub warn">Locks your wishlist for the rest of ${MNL[Number(m.slice(5))-1]} and cancels this month's clean-month bonus.</div></div>
   ${F('From',`<select name="from">${sav.map(a=>opt(a.id,a.name,'')).join('')}</select>`)+F('To',`<select name="to">${sp.map(a=>opt(a.id,a.name,'bpi')).join('')}</select>`)+F('Amount',`<input name="amount" inputmode="decimal" value="${Math.round(over)}">`)}
   <div class="pad"><button class="btns" style="margin:0">Take from savings</button></div></form>
  <button class="btns" data-act="close" style="margin-top:16px">Leave it. Next month's ${esc(e.name)} gets less.</button>`);
}
function envSheet(id){
  const e=envById(id),m=UI.tab==='budget'?UI.month:mk(todayISO());
  const txs=S.tx.filter(t=>mk(t.date)===m&&(t.envId===id||t.coverEnvId===id||false)).sort((a,b)=>b.date.localeCompare(a.date));
  const mv=S.moves.filter(x=>x.month===m&&(x.to===id||x.from===id));
  const L=(l,v,c='')=>`<div class="row"><div class="main">${l}</div><div class="r num ${c}">${v}</div></div>`;
  openSheet(e.name,`<div class="card">
   ${e.isOthers?L('Leftover this month',money(budgetOf(e,m),e.currency)):L('Budget this month',`<form data-form="envBudget" data-id="${id}" data-m="${m}" style="display:flex;gap:6px;justify-content:flex-end"><input name="b" inputmode="decimal" value="${budgetOf(e,m)}" style="width:110px;text-align:right;border:0;background:var(--fill);border-radius:8px;padding:6px 8px"><button class="btn">Set</button></form>`)}
   ${L('Rolled over from last month',money(carryOf(e,m),e.currency))}
   ${L('Moved in / out',money((D.moves[m+'|'+id]||0)+(D.cover[m+'|'+id]||0),e.currency))}
   ${L(e.isSavings?'Saved':'Spent',money(spentOf(e,m),e.currency))}

  <h2>${mLabel(m,1)}</h2><div class="card">${txs.map(txLine).join('')}${mv.map(x=>`<div class="row"><div class="main"><div class="t">Moved ${x.to===id?'from '+esc(envById(x.from)?.name||'?'):'to '+esc(envById(x.to)?.name||'?')}</div><div class="s">${dShort(x.date)}</div></div><div class="r num">${x.to===id?'+':'−'}${money(x.amount,e.currency)}</div><button class="btn btnd" style="font-size:14px;margin-left:8px" data-act="delMove" data-v="${x.id}">Undo</button></div>`).join('')||(!txs.length?'<div class="empty">Nothing yet</div>':'')}</div>
  <button class="btns" data-act="editEnt" data-k="env" data-v="${id}">Edit envelope</button>`);
}

function buySheet(w,anyway){

   ${F('Actual price (₱)',`<input name="price" inputmode="decimal" value="${num(w.price)}">`)}
   ${F('Paid with',`<select name="accountId">${accOpts(lastAcc||'bpi')}</select>`)}
   ${F('Date',`<input type="date" name="date" value="${todayISO()}">`)}
  </div><button class="btnp">${anyway?'Log it':'Done! I got it'}</button></form>`)}

/* generic entity editor */
const ENT={
 income:{list:'incomes',title:'Expected income',fields:()=>[['name','Name'],['amount','Amount','num'],['currency','Currency','sel',[['PHP','₱ PHP'],['KRW','₩ KRW']]],['date','Expected','date'],['accountId','Goes to','acc'],['kind','Type','sel',[['regular','Regular'],['tranche','Project tranche'],['loan','Loan']]],['debtId','Loan from','sel',[['','— not a loan —'],...S.debts.map(d=>[d.id,d.name])]]],blank:()=>({name:'',amount:0,currency:'PHP',date:todayISO(),accountId:'bpi',kind:'regular',debtId:''})},
 cost:{list:'costs',title:'Planned payment',fields:()=>[['name','Name'],['amount','Amount (₱)','num'],['date','Planned date','date'],['group','Group'],['note','Note'],['debtId','Pays off debt','sel',[['','— no —'],...S.debts.map(d=>[d.id,d.name])]]],blank:()=>({name:'',amount:0,date:todayISO(),group:'Other',note:'',debtId:''})},
 debt:{list:'debts',title:'Debt',fields:()=>[['name','Name'],['start','Owed at start (₱)','num'],['due','Due date','date'],['note','Note']],blank:()=>({name:'',start:0,due:'',note:''})},
 goal:{list:'goals',title:'Goal',fields:()=>[['name','Name'],['target','Target (₱)','num'],['accountId','Kept in','acc']],blank:()=>({name:'',target:0,accountId:S.accounts.find(isSavAcc)?.id})},
 acc:{list:'accounts',title:'Account',fields:()=>[['name','Name'],['currency','Currency','sel',[['PHP','₱ PHP'],['KRW','₩ KRW']]],['kind','Type','sel',[['spending','Spending'],['savings','Savings'],['both','Spending + savings']]],['start','Starting balance','num'],['archived','Hide account','chk']],blank:()=>({name:'',currency:'PHP',kind:'spending',start:0}),note:'To fix a balance, use “Update balances” instead of changing the starting balance.'},
 wish:{list:'wishlist',title:'Wish',fields:()=>[['name','Name'],['price','Price (₱ each)','num'],['stamps','Stamps (0 = auto)','num'],['qty','How many','num'],['target','Deadline','month'],['note','Note']],blank:()=>({name:'',price:0,stamps:0,qty:1,target:'',note:''}),note:'Auto stamps = 1 per ₱100 of the price.'},
 env:{list:'envelopes',title:'Envelope',fields:()=>[['emoji','Emoji'],['name','Name'],['budget','Default monthly','num'],['phase','Used in','sel',[['PH','Philippines (₱)'],['KR','Korea (₩)']]],['fixed','Fixed bill','chk'],['daily','Show per-day amount','chk'],['archived','Hide (archive)','chk']],blank:()=>({emoji:'',name:'',budget:0,phase:phaseOf(UI.month),fixed:false,daily:false,archived:false})},
};
function entSheet(k,id){
  const E=ENT[k];const o=id?S[E.list].find(x=>x.id===id):E.blank();
  const inp=([key,label,type,opts])=>{const v=o[key]??'';
    if(type==='sel')return F(label,`<select name="${key}">${opts.map(([a,b])=>opt(a,b,v)).join('')}</select>`);
    if(type==='acc')return F(label,`<select name="${key}">${accOpts(v)}</select>`);
    if(type==='chk')return F(label,`<span style="flex:1"></span><input type="checkbox" name="${key}" ${v?'checked':''}>`);
    if(type==='num')return F(label,`<input name="${key}" inputmode="decimal" value="${v}">`);
    if(type==='date')return F(label,`<input type="date" name="${key}" value="${v}">`);
    if(type==='month')return F(label,`<input type="month" name="${key}" value="${v}">`);
    return F(label,`<input name="${key}" value="${esc(v)}" autocomplete="off">`)};
  openSheet((id?'Edit ':'New ')+E.title.toLowerCase(),`<form data-form="ent" data-k="${k}" data-id="${id||''}"><div class="card">${E.fields().map(inp).join('')}</div>${E.note?`<div class="note">${E.note}</div>`:''}
  <button class="btnp">Save</button>${id?`<button type="button" class="btns btnd" data-act="delEnt" data-k="${k}" data-v="${id}">Delete</button>`:''}</form>`)}
function saveEnt(form){
  const k=form.dataset.k,id=form.dataset.id,E=ENT[k];const fd=new FormData(form);
  const o=id?S[E.list].find(x=>x.id===id):{id:uid(),...E.blank()};
  for(const [key,,type] of E.fields()){if(type==='chk')o[key]=fd.has(key);else if(type==='num')o[key]=num(fd.get(key));else o[key]=(fd.get(key)||'').trim()}
  if(!o.name){toast('Add a name');return}
  if(k==='env'){o.currency=o.phase==='KR'?'KRW':'PHP';if(!id)o.order=S.envelopes.length}
  if(k==='wish'&&!o.qty)o.qty=1;
  if(!id)S[E.list].push(o);closeSheet();commit();toast('Saved')}
function delEnt(k,id){
  const E=ENT[k];
  if(k==='acc'&&S.tx.some(t=>t.accountId===id||t.toAccountId===id)){alert('This account has entries. Rename it instead, or delete its entries first.');return}
  if(k==='env'&&S.tx.some(t=>t.envId===id)){if(!confirm('This envelope has entries. Hide it instead? (OK = hide)'))return;envById(id).archived=true;closeSheet();commit();return}
  if(!confirm('Delete this?'))return;S[E.list]=S[E.list].filter(x=>x.id!==id);closeSheet();commit()}
function settingsSheet(){
  openSheet('Settings',`<form data-form="settings"><div class="card">
   ${F('₩1 in ₱',`<input name="krwToPhp" inputmode="decimal" value="${S.settings.krwToPhp}">`)}
   ${F('Korea budget starts',`<input type="month" name="koreaStart" value="${S.settings.koreaStart>'2090'?'':S.settings.koreaStart}">`)}
   ${F('Budget started',`<input type="month" name="startMonth" value="${S.settings.startMonth}">`)}
   ${F('Monthly savings (₱)',`<input name="savePH" inputmode="decimal" value="${num((S.settings.saveTarget||{}).PH)}">`)}
   ${F('Monthly savings (₩)',`<input name="saveKR" inputmode="decimal" value="${num((S.settings.saveTarget||{}).KR)}">`)}
  </div><button class="btnp">Save settings</button></form>
  <h2>Backup</h2><div class="card"><button class="row chev" data-act="export"><div class="main"><div class="t">Export backup</div><div class="s">Save the file to iCloud Drive or Files</div></div></button><button class="row chev" data-act="import"><div class="main"><div class="t">Import backup</div><div class="s">Replaces everything on this phone</div></div></button></div>
  <h2>Danger zone</h2><div class="card"><button class="row btnd" data-act="reset">Erase all data</button></div>
  <div class="note">Pitaka stores data only on this device. No account, no bank connection.</div>`)}

/* ---------- backup ---------- */
async function doExport(){
  S.backups=S.backups||[];S.backups.push(todayISO());save();
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const name=`pitaka-backup-${todayISO()}.json`;
  try{const file=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});render();toast('Backup ready');return}}catch(e){if(e.name==='AbortError'){S.backups.pop();save();return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();render();toast('Backup downloaded')}
function doImport(file){
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.envelopes)||!Array.isArray(d.accounts))throw 0;
    if(S&&!confirm('Replace everything on this phone with this file?'))return;S=migrate(normalize(d));UI.month=mk(todayISO());closeSheet();commit();toast('Imported')}catch(e){alert('That file is not a Pitaka setup or backup.')}};r.readAsText(file)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,v=el.dataset.v;
  switch(a){
   case'tab':UI.tab=v;if(v==='budget')UI.month=mk(todayISO());if(v==='today'){UI.logMonth=mk(todayISO());UI.logDay=null}render();scrollTo(0,0);break;
   case'lPrev':UI.logMonth=addM(UI.logMonth,-1);UI.logDay=null;render();break;
   case'lNext':UI.logMonth=addM(UI.logMonth,1);UI.logDay=null;render();break;
   case'logAll':UI.logAll=v==='1';render();break;
   case'op':break;
   case'sec':S.settings.sec=S.settings.sec||{};S.settings.sec[v]=S.settings.sec[v]===false;commit();break;
   case'hide':S.settings.hide=!S.settings.hide;commit();break;
   case'noBills':S.settings.noBills=v==='1';commit();break;
   case'day':UI.logDay=UI.logDay===v?null:v;render();break;
   case'swDel':{const E=ENT[el.dataset.k];S[E.list]=S[E.list].filter(x=>x.id!==v);commit();toast('Deleted');break}
   case'add':txSheet('expense');break;
   case'seg':{const tp={expense:'expense',income:'income',transfer:'transfer'}[v],sv=0;const t={type:tp,date:todayISO(),time:nowTime(),amount:$('#sheet-root [name=amount]')?.value||'',desc:'',accountId:tp==='expense'?(lastAcc||'cash'):'bpi',_save:!!sv};txSheet(tp,t);e.preventDefault();break}
   case'editTx':{const t=S.tx.find(x=>x.id===v);if(t)txSheet(t.type,t);break}
   case'delTx':if(confirm('Delete this entry?')){S.tx=S.tx.filter(x=>x.id!==v);closeSheet();commit()}break;
   case'close':closeSheet();break;
   case'mPrev':UI.month=addM(UI.month,-1);render();break;
   case'mNext':UI.month=addM(UI.month,1);render();break;
   case'env':envSheet(v);break;
   case'move':moveSheet();break;
   case'delMove':S.moves=S.moves.filter(x=>x.id!==v);closeSheet();commit();break;
   case'nospend':S.checkins[todayISO()]='nospend';commit();toast('🌿 No-spend day · ⭐ +2');break;
   case'balances':balancesSheet();break;
   case'recv':{const i=S.incomes.find(x=>x.id===v);if(received().has(v)){toast('Already received');break}txSheet('income',{type:'income',date:todayISO(),time:'',amount:i.amount,desc:i.name,accountId:i.accountId,incomeId:i.id,debtId:i.debtId});break}
   case'pay':{const c=S.costs.find(x=>x.id===v);if(paidCosts().has(v)){toast('Already paid');break}
     if(c.debtId)txSheet('debtpay',{type:'debtpay',date:todayISO(),time:'',amount:c.amount,desc:c.name,accountId:'bpi',debtId:c.debtId,costId:c.id});
     else txSheet('expense',{type:'expense',date:todayISO(),time:'',amount:c.amount,desc:c.name,accountId:'bpi',envId:null,costId:c.id});break}
   case'payDebt':{const d=debtById(v);txSheet('debtpay',{type:'debtpay',date:todayISO(),time:'',amount:Math.round(debtOwed(d)),desc:'',accountId:'bpi',debtId:v});break}
   case'late':UI.late=!UI.late;render();break;
   case'addEnt':entSheet(v);break;
   case'editEnt':entSheet(el.dataset.k,v);break;
   case'delEnt':delEnt(el.dataset.k,v);break;
   case'buy':buySheet(S.wishlist.find(w=>w.id===v),false);break;
   case'buyAnyway':buySheet(S.wishlist.find(w=>w.id===v),true);break;
   case'settings':settingsSheet();break;
   case'export':doExport();break;
   case'import':$('#importFile').click();break;
   case'startEmpty':S=blankState();commit();break;
   case'reset':if(prompt('Type ERASE to delete all data on this phone')==='ERASE'){localStorage.removeItem(KEY);S=null;closeSheet();render()}break;
  }
});
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(f)doImport(f);e.target.value=''});
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.dataset.form)return;e.preventDefault();const fd=Object.fromEntries(new FormData(f));
  switch(f.dataset.form){
   case'tx':saveTx(f);break;
   case'ent':saveEnt(f);break;
   case'envBudget':{const m=f.dataset.m;S.monthBudgets[m]=S.monthBudgets[m]||{};S.monthBudgets[m][f.dataset.id]=num(fd.b);save();derive();envSheet(f.dataset.id);render();toast('Budget set for '+mLabel(m));break}
   case'move':{const amt=num(fd.amount);if(!amt||fd.from===fd.to){toast('Pick two envelopes and an amount');break}S.moves.push({id:uid(),month:f.dataset.m,from:fd.from,to:fd.to,amount:amt,date:todayISO()});closeSheet();commit();toast('Moved');break}
   case'coverMove':{const amt=num(fd.amount);if(!amt)break;S.moves.push({id:uid(),month:f.dataset.m,from:fd.from,to:f.dataset.env,amount:amt,date:todayISO()});closeSheet();commit();toast('Covered. Savings untouched.');break}
   case'coverSave':{const amt=num(fd.amount);if(!amt)break;S.tx.push({id:uid(),type:'transfer',amount:amt,date:todayISO(),time:nowTime(),desc:'Savings dip',accountId:fd.from,toAccountId:fd.to,coverEnvId:f.dataset.env});closeSheet();commit();toast('Taken from savings');break}
   case'balances':{const t=todayISO();let n=0;for(const a of liveAccs()){const want=num(fd[a.id]),diff=Math.round((want-(D.bal[a.id]||0))*100)/100;if(Math.abs(diff)>=0.01){S.tx.push({id:uid(),type:'adjust',amount:diff,date:t,time:'',desc:'',accountId:a.id});n++}}closeSheet();commit();toast(n?`Updated ${n} account${n>1?'s':''}`:'No changes');break}
   case'buy':{const w=S.wishlist.find(x=>x.id===f.dataset.id);const price=num(fd.price),te=treatEnv(mk(fd.date||todayISO()));
     S.tx.push({id:uid(),type:'expense',amount:Math.round(conv(price,'PHP',accCur(fd.accountId))),date:fd.date||todayISO(),time:'',desc:w.name,accountId:fd.accountId,envId:te?.id||null,wishId:w.id});
     if(!f.dataset.anyway)S.stampSpends.push({id:uid(),wishId:w.id,n:wishCost(w),date:todayISO()});
     w.qty=Math.max(0,(w.qty||1)-1);if(w.qty===0){w.bought=true;w.boughtDate=fd.date;w.boughtPrice=price}
     closeSheet();commit();derive();if(te&&avail(te,mk(fd.date||todayISO()))<-0.5){coverSheet(te,mk(fd.date||todayISO()),-avail(te,mk(fd.date||todayISO())))}else toast(f.dataset.anyway?'Logged':'🎉 Enjoy it!');break}
   case'settings':{S.settings.saveTarget={PH:num(fd.savePH),KR:num(fd.saveKR)};S.settings.krwToPhp=num(fd.krwToPhp)||0.0463;S.settings.koreaStart=fd.koreaStart||'2099-01';S.settings.startMonth=fd.startMonth||S.settings.startMonth;closeSheet();commit();toast('Saved');break}
  }
});

/* ---------- pace chart ---------- */
function paceChart(m){
  const di=dailyInfo(m),cur=di.cur,t=todayISO(),n=di.n;
  const tot=sum(di.envs,e=>budgetOf(e,m)+carryOf(e,m)+(D.moves[m+'|'+e.id]||0)+(D.cover[m+'|'+e.id]||0));
  const last=m<mk(t)?n:Number(t.slice(8));const act=[0];let c=0;
  for(let d=1;d<=last;d++){c+=di.spent[m+'-'+pad(d)]||0;act.push(c)}
  const W=340,H=170,L=8,Rr=8,T=10,B=20,ymax=Math.max(tot,c,1)*1.12;
  const X=d=>L+(W-L-Rr)*d/n,Y=v=>T+(H-T-B)*(1-v/ymax);
  const pace=d=>tot*d/n,diff=c-pace(last);
  const path=act.map((v,d)=>(d?'L':'M')+X(d).toFixed(1)+' '+Y(v).toFixed(1)).join('');
  window._pace={n,act,tot,cur,m,X,W};
  const ticks=[1,Math.round(n/2),n].map((d,k)=>`<text x="${X(d)}" y="${H-5}" text-anchor="${['start','middle','end'][k]}" font-size="10" fill="var(--text2)">${MN[Number(m.slice(5))-1]} ${d}</text>`).join('');
  return sec('pace','Spending pace',`<div class="card chart">
   <div class="legend"><span><i style="border-color:var(--blue)"></i>Spent so far</span><span><i style="border-color:var(--text3);border-top-style:dashed"></i>On-budget pace</span></div>
   <div class="tip"></div>
   <svg viewBox="0 0 ${W} ${H}" data-chart="pace" role="img" aria-label="Cumulative day-to-day spending versus budget pace">
    <line x1="${L}" y1="${Y(0)}" x2="${W-Rr}" y2="${Y(0)}" stroke="var(--sep)"/>
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(n)}" y2="${Y(tot)}" stroke="var(--text3)" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="${path}" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(last)}" cy="${Y(c)}" r="4" fill="var(--blue)" stroke="var(--card)" stroke-width="2"/>
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${Y(0)}" stroke="var(--text3)" stroke-width="1" style="display:none"/>
    ${ticks}</svg>
   <div class="sub" style="padding:4px 4px 2px">${diff>0.5?`<b>${money(diff,cur)} over</b> the pace for day ${last}.`:`<b>${money(-diff,cur)} under</b> the pace for day ${last}. ✓`} </div></div>`)}
function chartHover(e){
  const svg=e.target.closest('svg[data-chart=pace]');if(!svg||!window._pace)return;const P=window._pace,r=svg.getBoundingClientRect();
  const x=((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width*P.W;let d=Math.round((x-8)/(P.W-16)*P.n);d=Math.max(1,Math.min(P.n,d));
  const tip=svg.parentNode.querySelector('.tip'),xh=svg.querySelector('.xh');const px=P.X(d);
  xh.setAttribute('x1',px);xh.setAttribute('x2',px);xh.style.display='';
  tip.style.display='block';tip.style.left=(px/P.W*r.width+12)+'px';
  tip.textContent=`${MN[Number(P.m.slice(5))-1]} ${d}: `+(d<P.act.length?`spent ${money(P.act[d],P.cur)} · `:'')+`pace ${money(P.tot*d/P.n,P.cur)}`}
document.addEventListener('pointermove',chartHover);document.addEventListener('pointerdown',chartHover);

/* ---------- swipe to delete ---------- */
let sw=null,swMoved=false;
document.addEventListener('touchstart',e=>{const c=e.target.closest('.swc');document.querySelectorAll('.swc.open').forEach(o=>{if(o!==c){o.classList.remove('open');o.style.transform=''}});if(!c)return;sw={c,x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0,lock:null,base:c.classList.contains('open')?-88:0};swMoved=false},{passive:true});
document.addEventListener('touchmove',e=>{if(!sw)return;const dx=e.touches[0].clientX-sw.x,dy=e.touches[0].clientY-sw.y;if(sw.lock===null&&(Math.abs(dx)>8||Math.abs(dy)>8))sw.lock=Math.abs(dx)>Math.abs(dy);if(!sw.lock)return;swMoved=true;sw.dx=dx;const v=Math.max(-88,Math.min(0,sw.base+dx));sw.c.style.transition='none';sw.c.style.transform=`translateX(${v}px)`},{passive:true});
document.addEventListener('touchend',()=>{if(!sw)return;const c=sw.c;c.style.transition='';if(sw.lock){const open=sw.base+sw.dx<-44;c.classList.toggle('open',open);c.style.transform=open?'translateX(-88px)':''}sw=null;setTimeout(()=>{swMoved=false},400)},{passive:true});
document.addEventListener('click',e=>{if(swMoved&&e.target.closest('.swc')){e.stopPropagation();e.preventDefault();swMoved=false}},true);

/* ---------- calculator ---------- */
function opPress(o){const inp=$('#sheet-root [name=amount]');if(!inp)return;
  if(o==='C'){inp.value='';}else{const a=inp.selectionStart??inp.value.length,b=inp.selectionEnd??inp.value.length;inp.value=inp.value.slice(0,a)+o+inp.value.slice(b);try{inp.setSelectionRange(a+1,a+1)}catch(e){}}
  calcShow(inp)}
function calcShow(inp){const r=$('#sheet-root .calcres');if(!r)return;const v=inp.value;r.textContent=/[+\-−×÷*/()]/.test(v.replace(/^-/,''))?'= '+(Math.round(num(v)*100)/100).toLocaleString('en-US'):'amount'}
document.addEventListener('touchstart',e=>{const b=e.target.closest('[data-op]');if(b){e.preventDefault();opPress(b.dataset.op)}},{passive:false});
document.addEventListener('mousedown',e=>{const b=e.target.closest('[data-op]');if(b){e.preventDefault();opPress(b.dataset.op)}});
document.addEventListener('input',e=>{if(e.target.name==='amount'&&e.target.closest('#sheet-root .amt'))calcShow(e.target)});

/* ---------- boot ---------- */
S=load();render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S)render()});
</script>
